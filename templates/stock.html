<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>残り在庫 - 一番くじ</title>
</head>
<body>
    <h1>残り在庫一覧</h1>

    <ul>
        {% for prize in prizes %}
            <li>{{ prize.name }}（レア度：{{ prize.rarity }}）— 残り {{ prize.stock }} 個</li>
        {% endfor %}
    </ul>

    {% if session.user_id %}
        <a href="/draw">くじを引く</a>
        <a href="/collection">コレクションを見る</a>
        <a href="/logout">ログアウト</a>
    {% else %}
        <a href="/">トップページへ戻る</a>
    {% endif %}
</body>
</html>
