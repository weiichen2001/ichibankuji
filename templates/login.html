<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ログイン - 一番くじ</title>
</head>

<body>
    <h1>ログイン</h1>

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label>ユーザー名：<input type="text" name="username" required></label><br>
        <label>パスワード：<input type="password" name="password" required></label><br>
        <button type="submit">ログイン</button>
    </form>
    <a href="/register">アカウントをお持ちでない方はこちら</a><br>
    <a href="/">トップページへ戻る</a>
</body>

</html>
