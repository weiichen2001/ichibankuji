<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
    <title>ログイン - 一番くじ</title>
</head>
<body>
    <div class="auth-container">
        <div class="star-deco star-yellow" style="top: -18px; left: -18px; transform: rotate(-15deg);"></div>
        <div class="star-deco star-black" style="top: -14px; right: -20px; transform: rotate(20deg);"></div>
        <div class="star-deco star-yellow" style="bottom: -16px; right: 30px; transform: rotate(40deg);"></div>

        <h1 class="auth-title">ログイン</h1>

        {% if error %}
            <p class="auth-error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <label>ユーザー名
                <input type="text" name="username" required>
            </label>
            <label>パスワード
                <input type="password" name="password" required>
            </label>
            <button type="submit" class="home-cta-button home-cta-button-y auth-submit">ログイン</button>
        </form>

        <div class="auth-links">
            <a href="/register">アカウントをお持ちでない方はこちら</a><br>
            <a href="/">トップページへ戻る</a>
        </div>
    </div>
</body>
</html>
