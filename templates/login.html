<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Mochiy+Pop+One&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Mochiy+Pop+One&family=Rampart+One&display=swap"
        rel="stylesheet">
    <title>ログイン - 一番くじ</title>
</head>

<body>
    <div class="auth-container">
        <div class="star-deco star-yellow star-lg" style="top:-120px; left:-20px; transform:rotate(15deg);"></div>
        <div class="star-deco star-black star-sm" style="top:-15px; right:-85px; transform:rotate(-10deg);"></div>
        <div class="star-deco star-white star-md" style="bottom:-18px; left:-150px; transform:rotate(-20deg);"></div>
        <div class="star-deco star-yellow star-xs" style="bottom:5px; right:-12px; transform:rotate(8deg);"></div>

        <h1 class="auth-title">ログイン</h1>

        {% if error %}
        <p class="auth-error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <label>ユーザー名
                <input type="text" name="username" required>
            </label>
            <label>パスワード
                <input type="password" name="password" required>
            </label>
            <button type="submit" class="home-cta-button home-cta-button-y auth-submit">ログイン</button>
        </form>

        <div class="auth-links">
            <a href="/register">アカウントをお持ちでない方はこちら</a><br>
            <a href="/">トップページへ戻る</a>
        </div>
    </div>
</body>

</html>
