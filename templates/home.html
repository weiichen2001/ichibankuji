<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
    <title>一番くじ</title>
</head>
<body>
    <div class="page-container">
        <img src="{{ url_for('static', filename='images/home-cover.png') }}" class="home-cover" alt="一番くじ うちのホコリ">

<div class="title">
    <div class="title-uchi">うち</div>
    <div class="title-no">の</div>
    <div class="title-hokori">ホコリ</div>
    <div class="title-bikuri">!!</div>
</div>
        

        <div class="home-price">1回700円</div>

        <div class="home-actions">
            {% if session.user_id %}
                <a href="/draw" class="home-cta-button home-cta-button-y">くじを引く</a>
                <a href="/stock" class="home-cta-button home-cta-button-b">残り在庫を見る</a>
                <a href="/collection" class="home-cta-button home-cta-button-y">コレクションを見る</a>
                <a href="/logout" class="home-cta-button home-cta-button-b">ログアウト</a>
            {% else %}
                <a href="/login" class="home-cta-button home-cta-button-y">くじを引く</a>
                <a href="/stock" class="home-cta-button home-cta-button-b">残り在庫を見る</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
