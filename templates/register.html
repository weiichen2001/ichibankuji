<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>新規登録 - 一番くじ</title>
</head>

<body>
    <h1>アカウント作成</h1>

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}
    
    <form method="POST">
        <label>ユーザー名：<input type="text" name="username" required></label><br>
        <label>パスワード：<input type="password" name="password" required></label><br>
        <button type="submit">登録する</button>
    </form>
    <a href="/">トップページへ戻る</a>
</body>

</html>
