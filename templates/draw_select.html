<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Mochiy+Pop+One&family=Rampart+One&display=swap" rel="stylesheet">
    <title>くじを引く - 一番くじ</title>
</head>
<body>
    <div class="draw-select-container">
<div class="star-deco star-yellow star-lg" style="top:-20px; left:-100px; transform:rotate(15deg);"></div>
        <div class="star-deco star-black star-sm" style="top:-15px; right:-80px; transform:rotate(-10deg);"></div>
        <div class="star-deco star-white star-md" style="bottom:-18px; left:-118px; transform:rotate(-20deg);"></div>
        <div class="star-deco star-yellow star-xs" style="bottom:-12px; right:-60px; transform:rotate(8deg);"></div>

        <img src="{{ url_for('static', filename='images/draw-select-cat.png') }}" class="draw-select-photo" alt="くじを引く">

        <h1 class="draw-select-title">何回引きますか？</h1>

        <div class="draw-select-buttons">
            <a href="/draw/single" class="home-cta-button home-cta-button-y">1回引く</a>
            <a href="/draw/ten" class="home-cta-button home-cta-button-b">10回引く</a>
        </div>

        <div class="auth-links">
            <a href="/">トップページへ戻る</a>
        </div>
