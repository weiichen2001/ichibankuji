<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>結果 - 一番くじ</title>
</head>
<body>
    <h1>結果発表</h1>

    {% for prize in results %}
        <div>
            <h2>{{ prize.name }}</h2>
            <p>レア度：{{ prize.rarity }}</p>
            {% if prize.is_last_one %}
                <p>🎉 ラストワン賞！特別に「ラストワン賞・特製立牌」も獲得しました！</p>
            {% endif %}
        </div>
        <hr>
    {% endfor %}

    <a href="/draw">もう一度引く</a>
    <a href="/">トップページへ戻る</a>
    <a href="/collection">コレクションを見る</a>
    <a href="/stock">残り在庫を見る</a>
</body>
</html>
