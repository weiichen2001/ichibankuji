<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>コレクション - 一番くじ</title>
</head>
<body>
    <h1>マイコレクション</h1>

    {% if items %}
        <p>これまでに {{ items|length }} 個獲得しました</p>
        <ul>
            {% for item in items %}
                <li>{{ item.prize_name }}（レア度：{{ item.prize_rarity }}）</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>まだ何も獲得していません。くじを引いてみましょう！</p>
    {% endif %}

    <a href="/draw">くじを引く</a>
    <a href="/stock">残り在庫を見る</a>
    <a href="/logout">ログアウト</a>
</body>
</html>
